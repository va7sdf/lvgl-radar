# radar.conf - settings for the radar display
# Lines are "key = value"; lines starting with # are ignored.

# Station position (decimal degrees)
lat = 48.4220
lon = -123.3700

# Radius of the outer ring in nautical miles; rings are drawn at quarters.
# Tapping an empty part of the scope steps from range_min to range_max in
# range_step increments, then back to range_min.
range_nm = 10
range_min = 5
range_max = 25
range_step = 5

# ---- Sweep ----
# Seconds per revolution, width of the fading trail in degrees (0 = off),
# and animation frame rate. Lower the frame rate if the Pi struggles.
# With the sweep on, aircraft only move when the sweep passes over them.
sweep_period_s = 4
sweep_trail_deg = 45
sweep_fps = 20

# ---- Aircraft ----
# Seconds of track history drawn behind each aircraft, fading with age (0 = off)
trail_s = 120

# ---- Map ----
# Shoreline outline made by make_map.py for this position. Leave map_file
# empty for no map. Rebuild it with "Update map" in settings, or by running
# ./make_map.py --download yourself, if you move or raise range_max.
# map_options are extra make_map.py options the button uses, e.g.
#   map_options = --airports all --peaks CA.txt --towns cities1000.txt
map_file = map.txt
map_options =
map_colour = 3E7A63
show_rivers = yes
map_river_colour = 3C6E8A

# Airports (ring: code and elevation in feet), navaids (VOR diamond, NDB
# dot), peaks (triangle: name and elevation in feet) and towns (square), if
# make_map.py put them in the map. Labels that would overlap are dropped,
# most important first, so busy areas stay readable.
show_airports = yes
show_navaids = yes
show_peaks = yes
show_towns = yes
map_label_colour = 7FB59C

# ---- Touch and other screens ----
# Tap an aircraft for its details (swipe between them if several were under
# your finger); they close after detail_timeout_s untouched. Registration,
# type and route not in the feed are looked up from adsbdb.com when you tap;
# leave lookup_url empty to turn that off.
detail_timeout_s = 20
lookup_url = https://api.adsbdb.com/v0

# Clock and weather: shown after idle_after_s with no aircraft on the radar
# (0 = never), or swipe left on the radar. A swiped-to clock returns to the
# radar after weather_view_s if there are aircraft about. Tap to return.
# Swipe right for your receiver's stats and range plot, down for a list of
# aircraft in range, up for settings. Long-press an aircraft to follow it.
# Tap an empty part of the scope for the next range.
idle_after_s = 180
weather_view_s = 30
# Weather from Open-Meteo.com (free, no key). Leave weather_url empty for
# the clock only. The default URL is built in; set it here to change it.
weather_every_s = 900
# TrueType fonts for the clock and the temperature; both size themselves to
# fit. DSEG7 (seven-segment, SIL Open Font License) is in fonts/; the plain
# one is fonts/Montserrat-Medium.ttf
font_file = fonts/DSEG7Classic-Bold.ttf
temp_font_file = fonts/Montserrat-Medium.ttf
# Weather Icons by Erik Flowers (SIL Open Font License), for the current
# conditions and the forecast. Leave empty for no icons.
icon_font_file = fonts/weathericons-regular-webfont.ttf

# ---- Clock and units ----
# Also set from settings > Clock & units. The big clock shows UTC (Zulu)
# with local time underneath, or the other way round with clock_main = local.
clock_main = utc
clock_24h = yes
unit_temp = C           # C or F
unit_speed = kt         # kt, km/h or mph (aircraft and wind)
unit_alt = ft           # ft or m
unit_dist = nm          # nm, km or mi (distances in text; the scope is in nm)
unit_pressure = hPa     # hPa, kPa or inHg
# METAR shown on the weather screen (aviationweather.gov); empty = none
metar_station = CYYJ
# METAR source, {station} = the ICAO code; empty = aviationweather.gov
metar_url =

# ---- Alerts ----
# These open the aircraft's details when they come within range, once per
# aircraft per half hour. watch takes hex codes, registrations, callsigns
# or ICAO types, comma separated; end one with * to match the start, e.g.
#   watch = C-FTCA, RCH*, C130, A7615F
alert_emergency = yes
alert_military = yes
watch =

# ---- Receiver stats ----
# Your dump1090's stats.json; worked out from the first source if empty.
# The range plot is kept in range_file across restarts.
stats_url =
range_file = range.txt

# ---- Data sources ----
# Each [source] is polled separately and merged. When more than one reports
# the same aircraft, the source listed first wins, so put your own first.
# colour is RRGGBB for that source's aircraft and tracks. Red (emergency
# squawks 7500/7600/7700) and grey (on the ground) override it, so avoid
# those two here.
# In url, {lat} {lon} {dist} are filled in from the settings above.

[source]
name = local
url = http://192.168.1.10/data/aircraft.json
array_key = aircraft
poll_s = 1
colour = 48FF6A

# adsb.fi public API: personal, non-commercial use, max 1 request/second,
# and adsb.fi must be credited. Keeping the name "adsb.fi" shows that credit
# in the status line.
[source]
name = adsb.fi
url = https://opendata.adsb.fi/api/v3/lat/{lat}/lon/{lon}/dist/{dist}
array_key = ac
poll_s = 3
colour = 38C8FF

# Optional extra line under the counts, e.g. credit = data: adsb.fi
credit =

# ---- Devices ----
fb_dev = /dev/fb0
touch_dev = /dev/input/by-id/usb-Waveshare_Waveshare_-079-HD-event-if00
